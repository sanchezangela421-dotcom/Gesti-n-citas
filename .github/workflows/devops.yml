name: "Gestión Académica: Calidad y Seguridad (DevOps)"
run-name: "🚀 DevOps: ${{ github.ref_name }} (#${{ github.run_number }})"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      run_quality_check:
        description: '✅ Ejecutar Validaciones (Lint & Build)'
        required: true
        type: boolean
        default: true
      run_security_scan:
        description: '🛡️ Ejecutar Escáner de Vulnerabilidades (CodeQL)'
        required: true
        type: boolean
        default: true

jobs:

  # ─── SECRETS ────────────────────────────────────────────────────────────────
  secrets:
    name: "🔑 Secrets (TruffleHog)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Detectar Secrets
        # trufflesecurity/trufflehog@v3.94.2
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26
        with:
          path: ./
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event.repository.default_branch }}
          head: HEAD
          extra_args: --json --only-verified

  # ─── BACKEND ────────────────────────────────────────────────────────────────
  backend:
    name: "🔧 Backend"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_quality_check == true }}
    permissions:
      contents: read

    # Las pruebas corren contra un Postgres real: lo que hay que garantizar
    # (las FKs que protegen el expediente clínico, el aislamiento entre
    # organizaciones) vive en la base de datos y un mock lo daría por bueno.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_citas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Instalar Dependencias
        working-directory: server
        run: pnpm install --frozen-lockfile

      # Los reportes se siguen generando para el resumen, pero el paso ya NO
      # termina en "|| true": antes ninguna de estas puertas podía poner el
      # pipeline en rojo, así que no protegían de nada.
      - name: Lint
        working-directory: server
        run: |
          pnpm exec eslint src/ --format json --output-file eslint-report.json || true
          pnpm exec eslint src/

      - name: Typecheck
        working-directory: server
        run: pnpm run typecheck

      # Bloquea solo por dependencias que llegan a producción. Las de desarrollo
      # se reportan pero no rompen el build: sus avisos aparecen y desaparecen
      # constantemente y bloquearían PRs sin relación con el cambio.
      - name: Auditar Dependencias (informe completo)
        working-directory: server
        run: pnpm audit --audit-level=high --json > npm-audit.json 2>&1 || true

      - name: Auditar Dependencias de producción (bloqueante)
        working-directory: server
        run: pnpm audit --prod --audit-level=high

      - name: Build
        working-directory: server
        run: pnpm run build > build-error.log 2>&1
        env:
          DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"
          JWT_SECRET: "ci_test_secret_key_only"
          SESSION_SECRET: "ci_test_session_secret_key_only"

      - name: Pruebas
        working-directory: server
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gestion_citas"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gestion_citas_test"

      - name: Subir Reportes
        if: always()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-reports-${{ github.run_number }}
          path: |
            server/eslint-report.json
            server/npm-audit.json
            server/build-error.log
          if-no-files-found: ignore

  # ─── FRONTEND ───────────────────────────────────────────────────────────────
  frontend:
    name: "🎨 Frontend"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_quality_check == true }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: project_final/pnpm-lock.yaml

      - name: Instalar Dependencias
        working-directory: project_final
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: project_final
        run: |
          pnpm exec eslint src/ --format json --output-file eslint-report.json || true
          pnpm exec eslint src/

      # `vite build` NO comprueba tipos: sin este paso, un error de tipos llegaba
      # a producción con el pipeline en verde.
      - name: Typecheck
        working-directory: project_final
        run: pnpm run typecheck

      - name: Auditar Dependencias (informe completo)
        working-directory: project_final
        run: pnpm audit --audit-level=high --json > npm-audit.json 2>&1 || true

      - name: Auditar Dependencias de producción (bloqueante)
        working-directory: project_final
        run: pnpm audit --prod --audit-level=high

      - name: Build
        working-directory: project_final
        run: pnpm run build > build-error.log 2>&1
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Subir Reportes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-reports-${{ github.run_number }}
          path: |
            project_final/eslint-report.json
            project_final/npm-audit.json
            project_final/build-error.log
          if-no-files-found: ignore

  # ─── CODEQL ─────────────────────────────────────────────────────────────────
  codeql:
    name: "🛡️ CodeQL"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_security_scan == true }}
    permissions:
      actions: write
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Inicializar CodeQL
        # github/codeql-action@v3
        uses: github/codeql-action/init@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
        with:
          languages: 'javascript-typescript'
          queries: security-extended,security-and-quality

      - name: Analizar Vulnerabilidades
        uses: github/codeql-action/analyze@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
        with:
          category: "/language:javascript-typescript"

  # ─── RESUMEN ────────────────────────────────────────────────────────────────
  summary:
    name: "📋 Resumen"
    runs-on: ubuntu-latest
    needs: [secrets, backend, frontend, codeql]
    if: always()
    permissions:
      actions: write
    steps:
      - name: Descargar Reportes Backend
        # actions/download-artifact@v4
        uses: actions/download-artifact@v4
        with:
          name: backend-reports-${{ github.run_number }}
          path: backend
        continue-on-error: true

      - name: Descargar Reportes Frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-reports-${{ github.run_number }}
          path: frontend
        continue-on-error: true

      - name: Generar Resumen
        run: |
          BACKEND_RESULT="${{ needs.backend.result }}"
          FRONTEND_RESULT="${{ needs.frontend.result }}"
          SECRETS_RESULT="${{ needs.secrets.result }}"
          CODEQL_RESULT="${{ needs.codeql.result }}"

          echo "## 📋 Reporte Ejecutivo de Calidad y Seguridad" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── Secrets ──────────────────────────────────────────────────────
          echo "### 🔑 Detección de Secrets (TruffleHog)" >> $GITHUB_STEP_SUMMARY
          if   [ "$SECRETS_RESULT" == "failure" ]; then
            echo "❌ **SECRETS DETECTADOS**: TruffleHog encontró secrets expuestos en el código." >> $GITHUB_STEP_SUMMARY
          elif [ "$SECRETS_RESULT" == "success" ]; then
            echo "✅ **SIN SECRETS**: No se detectaron secrets expuestos." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **OMITIDO**: No aplica para este tipo de trigger." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── Auditoría de dependencias ─────────────────────────────────────
          echo "### 📦 Vulnerabilidades en Dependencias (npm audit)" >> $GITHUB_STEP_SUMMARY
          echo "| Proyecto | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for proj in backend frontend; do
            label="Backend (server)"; [ "$proj" == "frontend" ] && label="Frontend (project_final)"
            if [ -f "$proj/npm-audit.json" ]; then
              CRIT=$(python3 -c "import json; d=json.load(open('$proj/npm-audit.json')); print(d.get('metadata',{}).get('vulnerabilities',{}).get('critical',0))" 2>/dev/null || echo "0")
              HIGH=$(python3 -c "import json; d=json.load(open('$proj/npm-audit.json')); print(d.get('metadata',{}).get('vulnerabilities',{}).get('high',0))" 2>/dev/null || echo "0")
              if [ "$CRIT" != "0" ] || [ "$HIGH" != "0" ]; then
                echo "| $label | ❌ Críticas: $CRIT, Altas: $HIGH |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $label | ✅ Sin vulnerabilidades altas o críticas |" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "| $label | ⚠️ Reporte no disponible |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── Lint ──────────────────────────────────────────────────────────
          echo "### 🎨 Estilo y Estándares (ESLint)" >> $GITHUB_STEP_SUMMARY
          echo "| Proyecto | Errores | Avisos |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          for proj in backend frontend; do
            label="Backend (server)"; [ "$proj" == "frontend" ] && label="Frontend (project_final)"
            if [ -f "$proj/eslint-report.json" ]; then
              ERR=$(python3 -c "import json; d=json.load(open('$proj/eslint-report.json')); print(sum(f['errorCount'] for f in d))" 2>/dev/null || echo "?")
              WARN=$(python3 -c "import json; d=json.load(open('$proj/eslint-report.json')); print(sum(f['warningCount'] for f in d))" 2>/dev/null || echo "?")
              ICON="✅"; [ "${ERR}" != "0" ] && [ "${ERR}" != "?" ] && ICON="❌"
              echo "| $label | ${ICON} ${ERR} | ${WARN} |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $label | ⚠️ Omitido | - |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── Build ─────────────────────────────────────────────────────────
          echo "### 🏗️ Estado de la Construcción" >> $GITHUB_STEP_SUMMARY
          echo "| Proyecto | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          [ "$BACKEND_RESULT"  == "failure" ] \
            && echo "| Backend (server) | ❌ FALLÓ |"           >> $GITHUB_STEP_SUMMARY \
            || echo "| Backend (server) | ✅ Exitosa |"         >> $GITHUB_STEP_SUMMARY
          [ "$FRONTEND_RESULT" == "failure" ] \
            && echo "| Frontend (project_final) | ❌ FALLÓ |"   >> $GITHUB_STEP_SUMMARY \
            || echo "| Frontend (project_final) | ✅ Exitosa |" >> $GITHUB_STEP_SUMMARY

          if [ "$BACKEND_RESULT" == "failure" ] && [ -s backend/build-error.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Ver error del Backend</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -n 20 backend/build-error.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$FRONTEND_RESULT" == "failure" ] && [ -s frontend/build-error.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Ver error del Frontend</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -n 20 frontend/build-error.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── CodeQL ────────────────────────────────────────────────────────
          echo "### 🛡️ Escaneo de Seguridad (CodeQL)" >> $GITHUB_STEP_SUMMARY
          if   [ "$CODEQL_RESULT" == "success" ]; then
            echo "✅ **ANÁLISIS COMPLETADO**: Revisa la pestaña 'Security > Code scanning' en GitHub." >> $GITHUB_STEP_SUMMARY
          elif [ "$CODEQL_RESULT" == "skipped" ]; then
            echo "⚠️ **OMITIDO**: No aplica para este trigger." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FALLÓ**: Revisa el job de CodeQL para más detalles." >> $GITHUB_STEP_SUMMARY
          fi

          # ── Fallo del pipeline si hay problemas críticos ──────────────────
          if [ "$BACKEND_RESULT" == "failure" ] || [ "$FRONTEND_RESULT" == "failure" ] || [ "$SECRETS_RESULT" == "failure" ]; then
            exit 1
          fi

      - name: Subir Reporte Combinado
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reporte-pipeline-${{ github.run_number }}
          path: |
            backend/eslint-report.json
            backend/npm-audit.json
            backend/build-error.log
            frontend/eslint-report.json
            frontend/npm-audit.json
            frontend/build-error.log
          if-no-files-found: ignore
          retention-days: 30
