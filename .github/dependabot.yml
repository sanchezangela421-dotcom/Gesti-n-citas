version: 2
updates:
  # Backend (Express + TypeScript)
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      server-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "backend"

  # Frontend (React + Vite)
  - package-ecosystem: "npm"
    directory: "/project_final"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      frontend-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "frontend"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci-cd"
